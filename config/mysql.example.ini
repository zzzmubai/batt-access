# V3 runtime account: SELECT/INSERT/UPDATE/DELETE only. No DDL privileges.
# Copy to a private absolute path on the Linux host, chmod 600, fill locally.
[mysql]
host=127.0.0.1
port=3306
database=batt_access_v3
user=batt_runtime
password=REPLACE_ME
runtime_dir=/home/book/batt-v3-runtime
connect_timeout=2
read_timeout=1
write_timeout=1
lock_wait_timeout=1
